spring.datasource.url=jdbc:h2:mem:redclubes;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.placeholders.logo_type=CLOB
redclubes.demo.enabled=false
redclubes.bootstrap.superuser.enabled=false
