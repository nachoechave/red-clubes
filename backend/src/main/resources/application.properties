spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline de esquema existente
spring.flyway.placeholders.logo_type=LONGTEXT

server.error.include-stacktrace=never
server.error.include-message=never

redclubes.demo.enabled=${DEMO_DATA_ENABLED:false}
redclubes.bootstrap.superuser.enabled=${BOOTSTRAP_SUPERUSER_ENABLED:false}
redclubes.auth.session-hours=${AUTH_SESSION_HOURS:8}
redclubes.auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
redclubes.auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}
redclubes.auth.login.block-minutes=${AUTH_LOGIN_BLOCK_MINUTES:15}
redclubes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
