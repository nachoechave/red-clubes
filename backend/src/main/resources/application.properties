spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.max-http-request-header-size=16KB
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline de esquema existente
spring.flyway.placeholders.logo_type=LONGTEXT

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}

redclubes.demo.enabled=${DEMO_DATA_ENABLED:false}
redclubes.bootstrap.superuser.enabled=${BOOTSTRAP_SUPERUSER_ENABLED:false}
redclubes.auth.session-hours=${AUTH_SESSION_HOURS:8}
redclubes.auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
redclubes.auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}
redclubes.auth.login.block-minutes=${AUTH_LOGIN_BLOCK_MINUTES:15}
redclubes.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
