name: red-clubes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-red_clubes}
      MYSQL_USER: ${MYSQL_USER:-red_clubes_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defini MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defini MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=-03:00
      - --innodb-buffer-pool-size=768M
      - --max-connections=80
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    cpus: 0.90
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks: [private]

  backend:
    image: ${BACKEND_IMAGE:-red-clubes-backend}:${IMAGE_TAG:-local}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-red_clubes}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
      DB_USERNAME: ${MYSQL_USER:-red_clubes_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defini MYSQL_PASSWORD en .env}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DB_POOL_VALIDATION_TIMEOUT_MS: ${DB_POOL_VALIDATION_TIMEOUT_MS:-3000}
      DB_POOL_MAX_LIFETIME_MS: ${DB_POOL_MAX_LIFETIME_MS:-1800000}
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      AUTH_LOGIN_BLOCK_MINUTES: ${AUTH_LOGIN_BLOCK_MINUTES:-15}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      BOOTSTRAP_SUPERUSER_ENABLED: ${BOOTSTRAP_SUPERUSER_ENABLED:-false}
      BOOTSTRAP_SUPERUSER_DNI: ${BOOTSTRAP_SUPERUSER_DNI:-}
      BOOTSTRAP_SUPERUSER_PASSWORD: ${BOOTSTRAP_SUPERUSER_PASSWORD:-}
      BOOTSTRAP_SUPERUSER_NAME: ${BOOTSTRAP_SUPERUSER_NAME:-Administrador}
      BOOTSTRAP_SUPERUSER_LASTNAME: ${BOOTSTRAP_SUPERUSER_LASTNAME:-Inicial}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=65.0
        -XX:InitialRAMPercentage=20.0
        -XX:+ExitOnOutOfMemoryError
        -Duser.timezone=America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1152m
    cpus: 0.85
    pids_limit: 192
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    networks: [private]

  frontend:
    image: ${FRONTEND_IMAGE:-red-clubes-frontend}:${IMAGE_TAG:-local}
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.30.0.1/32}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks: [private]

volumes:
  mysql_data:

networks:
  private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.0.1}
