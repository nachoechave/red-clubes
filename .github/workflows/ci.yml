name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --redact --no-banner --verbose

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high and critical npm vulnerabilities
        run: npm audit --audit-level=high
      - name: Test frontend
        run: npm test -- --watch=false
      - name: Build frontend
        run: npm run build

  backend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Scan Maven dependencies with OWASP Dependency-Check
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7
          -DfailOnError=true
          -Dformats=HTML,JSON
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    needs: [secrets, backend, frontend, backend-dependencies]
    env:
      MYSQL_PASSWORD: ci-app-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      APP_PORT: "18080"
      IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: red-clubes-backend:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: red-clubes-frontend:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Start and smoke test stack
        run: |
          docker compose up -d --wait
          BASE_URL=http://127.0.0.1:18080 sh ops/smoke-test.sh
      - name: Verify backup and isolated restore
        run: |
          export BACKUP_DIR="$RUNNER_TEMP/red-clubes-backups"
          sh ops/backup-mysql.sh
          backup_name=$(cat "$BACKUP_DIR/.last-success")
          sh ops/restore-test.sh "$BACKUP_DIR/$backup_name"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
